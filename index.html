<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Father and Daughter Game Dashboard</title>
    <style>
        /* --- General CSS & Responsive Setup --- */
        :root {
            --galaxy-bg: radial-gradient(circle, #2d004d, #0d001a, #000);
            --black-wide-channel-color: #111;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            background: #111;
            color: white;
            display: flex;
            justify-content: center;
            overflow-x: hidden; /* Prevent horizontal scrolling */
            min-height: 100vh;
            box-sizing: border-box;
        }

        * {
            box-sizing: border-box;
        }

        .main-container {
            width: 100%;
            max-width: 1200px;
            padding: 2vw;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }

        /* --- Banner Section --- */
        .banner-container {
            width: 100%;
            height: clamp(50px, 8vw, 80px);
            overflow: hidden;
            background: #222;
            border-radius: 10px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            position: relative;
        }

        .banner-text {
            color: #ff00ff;
            font-size: clamp(20px, 4vw, 40px);
            white-space: nowrap;
            position: absolute;
            text-transform: uppercase;
            font-weight: bold;
            animation: bannerSlideLeftToRight 12s linear infinite;
        }

        @keyframes bannerSlideLeftToRight {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        /* --- Main Content Layout (Auto Ratio for all screens) --- */
        .main-content {
            display: grid;
            grid-template-columns: 1fr clamp(80px, 15vw, 150px) 1fr;
            gap: clamp(10px, 3vw, 20px);
            align-items: stretch;
            position: relative;
            flex-grow: 1;
        }

        /* --- Player Panel --- */
        .player-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: rgba(30, 30, 30, 0.8);
            padding: clamp(10px, 2vw, 20px);
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.7);
            z-index: 10;
        }

        /* Photo Cards */
        .photo-card {
            width: 100%;
            aspect-ratio: 4 / 3; /* Auto maintains shape */
            border-radius: 10px;
            background: linear-gradient(135deg, #ff007f, #aa00ff, #00ffff);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
            position: relative;
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid white;
        }

        /* Point Dashboards */
        .point-dashboard {
            width: 100%;
            flex-grow: 1;
            min-height: 150px;
            border-radius: 15px;
            padding: 10px;
            display: flex;
            position: relative;
        }

        #daughter-dashboard {
            background: radial-gradient(circle, rgba(255, 0, 255, 0.2), #0d001a);
            border: 3px solid #ff00ff;
            animation: animatePurple 10s infinite alternate;
        }

        @keyframes animatePurple {
            0% { box-shadow: 0 0 5px #ff00ff; }
            100% { box-shadow: 0 0 20px #ff00ff, 0 0 40px #aa00ff; }
        }

        #father-dashboard {
            background: radial-gradient(circle, rgba(0, 255, 255, 0.2), #001f3f);
            border: 3px solid #00ffff;
            animation: animateBluePink 12s infinite alternate;
        }

        @keyframes animateBluePink {
            0% { box-shadow: 0 0 5px #00ffff; }
            100% { box-shadow: 0 0 20px #00ffff, 0 0 40px #ff00ff; }
        }

        .typing-area {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            color: #eee;
            font-size: clamp(14px, 2vw, 18px);
            line-height: 1.5;
            resize: none;
            outline: none;
        }

        /* Total Points Section with Fire Effect */
        .total-points-display {
            text-align: center;
            font-size: clamp(20px, 4vw, 32px);
            font-weight: bold;
            color: #fff;
            animation: fireText 1.5s infinite alternate;
        }

        @keyframes fireText {
            0% { text-shadow: 0 0 5px #fff, 0 -2px 10px #ffb300, 0 -5px 15px #ff5100; }
            100% { text-shadow: 0 0 10px #fff, 0 -5px 15px #ffb300, 0 -10px 20px #ff0000; }
        }

        /* --- Central Galaxy Vortex --- */
        .central-channel {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            height: 100%;
        }

        .vortex {
            width: clamp(60px, 12vw, 130px);
            height: clamp(60px, 12vw, 130px);
            background: var(--galaxy-bg);
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px #ff00ff, 0 0 30px #00ffff, inset 0 0 30px #ff00ff;
            z-index: 5;
            flex-shrink: 0;
        }

        .vortex-swirl {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent, #ff00ff, #00ffff, transparent);
            animation: vortexSpin 2s infinite linear;
        }

        @keyframes vortexSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Black channel for arrows to go UP */
        .black-channel {
            width: clamp(40px, 8vw, 80px);
            flex-grow: 1;
            background-color: var(--black-wide-channel-color);
            margin-top: -5px;
            border-radius: 10px;
            position: relative;
            z-index: 1;
        }

        /* --- Footer Section --- */
        .footer-flow {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 10px;
        }

        .win-box {
            background-color: #222;
            border: 4px solid #ff00ff;
            color: #fff;
            font-size: clamp(20px, 4vw, 36px);
            font-weight: bold;
            padding: clamp(10px, 2vw, 15px) clamp(20px, 4vw, 40px);
            text-transform: uppercase;
            border-radius: 10px;
            text-align: center;
            animation: winColorChange 2s infinite alternate;
        }

        @keyframes winColorChange {
            0% { border-color: #ff00ff; box-shadow: 0 0 10px #ff00ff; text-shadow: 0 0 5px #ff00ff; }
            50% { border-color: #aa00ff; box-shadow: 0 0 20px #aa00ff; text-shadow: 0 0 10px #aa00ff; }
            100% { border-color: #ff66ff; box-shadow: 0 0 10px #ff66ff; text-shadow: 0 0 5px #ff66ff; }
        }

        /* --- Live Animated Flowing Arrows --- */
        .live-arrow {
            position: absolute;
            font-size: clamp(16px, 3vw, 24px);
            font-weight: bold;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #ff00ff;
            pointer-events: none;
            z-index: 20;
            transition: transform 0.1s;
        }

    </style>
</head>
<body>

<div class="main-container" id="game-container">
    <div class="banner-container">
        <div class="banner-text">FATHER AND DAUGHTER GAMING BANNER</div>
    </div>

    <div class="main-content">
        <div class="player-panel">
            <div class="photo-card" id="daughter-photo-card">
                <img src="https://drive.google.com/thumbnail?id=1NxVXYsyzeX_0V0LWG3icaBSZCRmA24np&sz=w800" alt="Daughter Photo">
            </div>
            <div class="point-dashboard" id="daughter-dashboard">
                <textarea class="typing-area" id="daughter-textarea" placeholder="Type here..."></textarea>
            </div>
            <div class="total-points-display" id="daughter-total-display">
                Total Point = 0
            </div>
        </div>

        <div class="central-channel" id="central-channel">
            <div class="vortex" id="vortex">
                <div class="vortex-swirl"></div>
            </div>
            <div class="black-channel" id="black-channel"></div>
        </div>

        <div class="player-panel">
            <div class="photo-card" id="father-photo-card">
                <img src="https://drive.google.com/thumbnail?id=1-PsqAR1wuGJSb4P41caATu_zb5ghj6ui&sz=w800" alt="Father Photo">
            </div>
            <div class="point-dashboard" id="father-dashboard">
                <textarea class="typing-area" id="father-textarea" placeholder="Type here..."></textarea>
            </div>
            <div class="total-points-display" id="father-total-display">
                Total Point = 0
            </div>
        </div>
    </div>

    <div class="footer-flow">
        <div class="win-box">
            TANISKA WILL BE WIN
        </div>
    </div>
</div>

<script>
    // --- Auto Point Logic ---
    function calculatePoints(textareaId) {
        const text = document.getElementById(textareaId).value;
        const numbers = text.match(/\d+/g);
        return numbers ? numbers.reduce((sum, num) => sum + parseInt(num, 10), 0) : 0;
    }

    function updateTotals() {
        document.getElementById('daughter-total-display').textContent = `Total Point = ${calculatePoints('daughter-textarea')}`;
        document.getElementById('father-total-display').textContent = `Total Point = ${calculatePoints('father-textarea')}`;
    }

    document.getElementById('daughter-textarea').addEventListener('input', updateTotals);
    document.getElementById('father-textarea').addEventListener('input', updateTotals);

    // --- Dynamic & Responsive Arrow Animation ---
    const container = document.getElementById('game-container');
    const vortex = document.getElementById('vortex');
    const daughterCard = document.getElementById('daughter-photo-card');
    const fatherCard = document.getElementById('father-photo-card');
    
    let arrows = [];

    function createArrow() {
        const arrow = document.createElement('div');
        arrow.className = 'live-arrow';
        arrow.textContent = '➤';
        container.appendChild(arrow);

        const containerRect = container.getBoundingClientRect();
        const isLeft = Math.random() < 0.5;
        
        const arrowData = {
            el: arrow,
            phase: 'move-in',
            x: isLeft ? containerRect.width * 0.2 : containerRect.width * 0.8,
            y: containerRect.height - 20,
            targetSide: Math.random() < 0.5 ? 'left' : 'right',
            angle: isLeft ? -Math.PI/4 : -3*Math.PI/4, 
            scale: 1,
            spinAngle: 0
        };

        arrow.style.transform = `rotate(${arrowData.angle}rad)`;
        arrows.push(arrowData);
    }

    function animateArrows() {
        // Recalculate positions every frame so it NEVER breaks on screen resize
        const cRect = container.getBoundingClientRect();
        const vRect = vortex.getBoundingClientRect();
        const dCardRect = daughterCard.getBoundingClientRect();
        const fCardRect = fatherCard.getBoundingClientRect();
        
        const vX = (vRect.left - cRect.left) + vRect.width / 2;
        const vY = (vRect.top - cRect.top) + vRect.height / 2;
        const bottomCX = cRect.width / 2;
        const bottomCY = cRect.height - 50;

        for (let i = arrows.length - 1; i >= 0; i--) {
            let a = arrows[i];

            if (a.phase === 'move-in') {
                const dx = bottomCX - a.x;
                const dy = bottomCY - a.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 10) a.phase = 'move-up';
                else { a.x += (dx/dist) * 2; a.y += (dy/dist) * 2; a.angle = Math.atan2(dy, dx); }

            } else if (a.phase === 'move-up') {
                const dx = vX - a.x;
                const dy = vY - a.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < vRect.width / 2) {
                    a.phase = 'spin';
                    a.spinRadius = vRect.width / 2;
                } else {
                    a.x += (dx/dist) * 2.5; a.y += (dy/dist) * 2.5; a.angle = Math.atan2(dy, dx);
                }

            } else if (a.phase === 'spin') {
                a.x = vX + Math.cos(a.spinAngle) * a.spinRadius;
                a.y = vY + Math.sin(a.spinAngle) * a.spinRadius;
                a.spinAngle += 0.08;
                a.spinRadius -= 0.2;
                a.angle = a.spinAngle + Math.PI/2; 
                if (a.spinAngle > Math.PI * 3) a.phase = 'branch-out';

            } else if (a.phase === 'branch-out') {
                // Fly directly into the center of the photo cards!
                const targetRect = a.targetSide === 'left' ? dCardRect : fCardRect;
                const tX = (targetRect.left - cRect.left) + targetRect.width / 2;
                const tY = (targetRect.top - cRect.top) + targetRect.height / 2;
                
                const dx = tX - a.x;
                const dy = tY - a.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < 15) {
                    a.el.remove();
                    arrows.splice(i, 1);
                    continue;
                } else {
                    a.x += (dx/dist) * 3.5; a.y += (dy/dist) * 3.5; a.angle = Math.atan2(dy, dx);
                    a.scale = Math.max(0, a.scale - 0.01);
                }
            }
            a.el.style.left = a.x + 'px';
            a.el.style.top = a.y + 'px';
            a.el.style.transform = `rotate(${a.angle}rad) scale(${a.scale})`;
        }
        requestAnimationFrame(animateArrows);
    }

    // Spawn arrows
    setInterval(createArrow, 800);
    animateArrows();
</script>

</body>
</html>
